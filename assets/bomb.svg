<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#FF2A2A" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#FF1A1A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#3A3A40"/>
      <stop offset="45%" stop-color="#16161A"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="fuse" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4A574"/>
      <stop offset="100%" stop-color="#E8D3A4"/>
    </linearGradient>
    <filter id="sparkblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <circle cx="100" cy="128" r="96" fill="url(#glow)"/>
  <circle cx="100" cy="132" r="70" fill="url(#body)" stroke="#FF2A32" stroke-width="3"/>
  <ellipse cx="78" cy="108" rx="22" ry="14" fill="#fff" opacity="0.12"/>
  <!-- cap -->
  <rect x="86" y="58" width="28" height="16" rx="3" fill="#1A1A1E" stroke="#FF2A32" stroke-width="2"/>
  <rect x="80" y="68" width="40" height="10" rx="2" fill="#2A2A30" stroke="#E01820" stroke-width="1.5"/>
  <!-- fuse -->
  <path d="M100 58 C100 42, 118 40, 122 28 C126 16, 114 14, 128 8" stroke="url(#fuse)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- spark glow -->
  <circle cx="132" cy="8" r="14" fill="#FF4D1A" opacity="0.45" filter="url(#sparkblur)"/>
  <circle cx="132" cy="8" r="6" fill="#FFE56B"/>
  <circle cx="132" cy="8" r="3" fill="#fff"/>
  <!-- spark rays -->
  <g stroke="#FFC14A" stroke-width="2" stroke-linecap="round">
    <path d="M132 8 L132 -6"/>
    <path d="M132 8 L144 0"/>
    <path d="M132 8 L146 12"/>
    <path d="M132 8 L120 0"/>
    <path d="M132 8 L118 14"/>
  </g>
</svg>
