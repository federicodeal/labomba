<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi entrada · LA BOMBA</title><link rel="icon" href="assets/bomb.svg"><link rel="stylesheet" href="app.css"></head>
<body><div class="page" style="text-align:center">
<div class="hero"><img class="bomb" src="assets/bomb.svg" alt=""><div class="logo">LA BOMBA</div><div class="hosts">Laura &amp; Pablo</div></div>
<div class="meta"><div><span>Cuándo</span><b>Sáb 21 nov</b></div><div><span>Dónde</span><b>Al Fin y al Cabo</b><span>Montoya</span></div>
<div><span>Guest list</span><b>21 hs</b></div><div><span>Puertas</span><b>00 hs</b></div></div>
<div class="card" id="box"><p class="hint">Cargando tu entrada…</p></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script><script src="api.js"></script>
<script>
(async () => {
  const t = new URLSearchParams(location.search).get('t') || (localStorage.getItem('lb_ticket') || '');
  const box = $('#box');
  if (!t) { box.innerHTML = '<p class="hint">No encontramos tu entrada. Usá el link que te llegó por mail.</p>'; return; }
  try {
    const r = await api('ticket', { token: t });
    const ents = r.entradas && r.entradas.length ? r.entradas : [{ token: t, nombre: r.nombre, estado: r.estado, usado: r.usado }];
    if (r.estado === 'aprobado') {
      const many = ents.length > 1;
      box.innerHTML = (many ? '<div class="kicker">' + ents.length + ' entradas</div><p class="hint">Cada QR vale para una persona. Podés mandarle a cada uno su link.</p>' : '') +
        ents.map((e, i) => '<div style="margin-top:' + (i ? 22 : 0) + 'px">' + (many ? '<div class="kicker">Entrada ' + (i + 1) + '</div>' : '<div class="kicker">Hola</div>') +
          '<h3 style="font-size:22px">' + esc(e.nombre) + '</h3>' +
          (e.estado === 'aprobado' ? '<div class="qrbox" id="qr' + i + '"></div>' : '<p class="hint">Entrada ' + esc(e.estado) + '</p>') +
          (e.usado ? '<p class="hint">Usada a las ' + esc(e.usado) + '</p>' : '') +
          (many ? '<button class="btn sm ghost" data-l="' + esc(e.token) + '" style="margin-top:6px">Copiar link de esta entrada</button>' : '') + '</div>').join('') +
        '<div class="kicker" style="margin-top:14px">Mostralo en la puerta</div>' +
        '<p class="hint" style="margin-top:8px">Se marca como usado la primera vez que se escanea.</p>';
      ents.forEach((e, i) => { if (e.estado === 'aprobado') new QRCode($('#qr' + i), { text: e.token, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M }); });
      box.onclick = ev => { const b = ev.target.closest('[data-l]'); if (!b) return; const u = location.origin + location.pathname + '?t=' + b.dataset.l; navigator.clipboard.writeText(u).catch(() => prompt('Copiá el link:', u)); b.textContent = 'Copiado'; };
    } else if (r.estado === 'pendiente') {
      box.innerHTML = '<h3>' + esc(r.nombre) + '</h3><p class="hint">Tu pago' + (ents.length > 1 ? ' de ' + ents.length + ' entradas' : '') + ' está <b>pendiente de confirmación</b>. Cuando lo aprobemos, en esta misma página aparece tu QR (y te llega por mail).</p>';
    } else {
      box.innerHTML = '<h3>' + esc(r.nombre) + '</h3><p class="hint">Tu comprobante no fue aprobado. Escribile a los organizadores.</p>';
    }
  } catch (x) { box.innerHTML = '<p class="hint">' + esc(x.message) + '</p>'; }
})();
</script></body></html>
